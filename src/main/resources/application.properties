########################################
# App Identity & Server
########################################
spring.application.name=corroboro-vault
server.port=${VAULT_SERVER_PORT:8090}
server.forward-headers-strategy=framework

########################################
# Error handling — never expose stacktraces or internal messages to clients
########################################
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

########################################
# Logging
########################################
logging.pattern.level='[${spring.application.name:},%X{traceId},%X{spanId}]'
logging.file.path=${VAULT_LOG_PATH:/logs}

########################################
# DataSource (PostgreSQL) — the vault's own dedicated database, never shared
# with the main backend's cop_registry/cop_common/per-clinic schemas.
########################################
spring.datasource.url=${VAULT_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=vault}
spring.datasource.username=${VAULT_DB_USERNAME:postgres}
spring.datasource.password=${VAULT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

########################################
# JPA & Hibernate
########################################
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate, never auto-migrate — schema changes are hand-run SQL, same convention
# as the main backend. See src/main/resources/database/.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

########################################
# Service-to-service auth — the vault's only auth mechanism. SuperMed's backend
# is the sole trusted caller; the same secret must be set as VAULT_SERVICE_TOKEN
# in cop-be's own environment. Generate with: openssl rand -hex 32
########################################
vault.service-token=${VAULT_SERVICE_TOKEN}

########################################
# On-disk file storage root. In every real deployment this is a Docker volume
# mounted at a host path already covered by the existing backup/NAS-sync setup
# (confirm the exact path on the Mac mini before deploying — see File-Storage.md).
########################################
vault.storage.root-path=${VAULT_STORAGE_ROOT:/data/vault-files}

########################################
# Retention — files are purged this many days after the appointment date.
# Cancelling an appointment blocks further upload/view immediately but does NOT
# change deleteAfter — the original clock keeps running.
########################################
vault.retention.days=${VAULT_RETENTION_DAYS:15}
vault.purge.enabled=${VAULT_PURGE_ENABLED:true}
# Cron: daily at 03:30 Europe/Bucharest, off-peak.
vault.purge.cron=${VAULT_PURGE_CRON:0 30 3 * * *}
# Manual /internal/admin/purge trigger — for testing only. Must stay false in prod;
# the endpoint 404s (not just unauthorized) when disabled, to avoid hinting it exists.
vault.purge.manual-trigger-enabled=${VAULT_PURGE_MANUAL_TRIGGER_ENABLED:false}

########################################
# ClamAV — clamd sidecar, INSTREAM protocol. Disabled on acceptance (nightly-
# reseeded, synthetic data only — see application-acceptance.properties).
########################################
vault.clamav.enabled=${VAULT_CLAMAV_ENABLED:true}
vault.clamav.host=${VAULT_CLAMAV_HOST:localhost}
vault.clamav.port=${VAULT_CLAMAV_PORT:3310}
vault.clamav.timeout-ms=${VAULT_CLAMAV_TIMEOUT_MS:60000}

########################################
# Uploads — medical imaging (MRI/CT), not just small documents. Raised well past
# Spring's 1MB default; ClamAV's own StreamMaxLength (clamd.conf) must be raised
# to match on the clamd side, independently of this app.
########################################
spring.servlet.multipart.max-file-size=${VAULT_MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size=${VAULT_MAX_REQUEST_SIZE:2GB}
# Large uploads can take real wall-clock time (network + virus scan) — generous
# server-side timeouts so neither is cut off mid-transfer.
server.tomcat.connection-timeout=${VAULT_CONNECTION_TIMEOUT_MS:300000}
spring.mvc.async.request-timeout=${VAULT_ASYNC_REQUEST_TIMEOUT_MS:300000}

########################################
# Actuator — /actuator/health only, for the Docker healthcheck. No other
# endpoints exposed.
########################################
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
