########################################
# Local development overrides
########################################
logging.file.path=./logs

# Shares the same local Postgres instance as the main backend (no "postgres" role
# locally — connects as the OS user), in its own "vault" schema so it never
# collides with cop_registry/cop_common/clinic schemas. Create it once with:
#   psql -d postgres -c "CREATE SCHEMA IF NOT EXISTS vault;"
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=vault
spring.datasource.username=olteanmarius-nicolae-pro
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dev-only static secret — never used in production. Must match VAULT_SERVICE_TOKEN
# in the main backend's own dev config for the two to talk to each other locally.
vault.service-token=dev-vault-token-change-me

# Local disk folder, relative to wherever the app is run from.
vault.storage.root-path=./vault-files-dev

# No local clamd required for day-to-day dev — every upload is treated as CLEAN.
# Set to true only when specifically testing the ClamAV integration itself
# (run `docker run -p 3310:3310 clamav/clamav` first).
vault.clamav.enabled=false

# Lets you fast-forward retention locally instead of waiting real days:
# POST /internal/admin/purge (with the service token) after backdating a test
# registration's delete_after via SQL.
vault.purge.manual-trigger-enabled=true
